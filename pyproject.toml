[project]
name = "genomics-mcp"
version = "0.1.0"
description = "MCP server exposing ClinVar, gnomAD and Ensembl VEP to AI agents, with a variant-interpretation eval"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=2.2.0",
]

[project.optional-dependencies]
eval = [
    "anthropic>=1.0",
]

[project.scripts]
genomics-mcp = "genomics_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/genomics_mcp"]

[dependency-groups]
dev = ["pytest>=8"]
